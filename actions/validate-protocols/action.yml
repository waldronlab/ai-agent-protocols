name: 'Validate protocols'
description: 'Check every protocol.md in a repository against the AI agent protocol standard.'

inputs:
  protocols-path:
    description: 'Directory holding the protocols, relative to the repository root.'
    required: false
    default: 'protocols'
  r-version:
    description: 'R version to install.'
    required: false
    default: 'release'

runs:
  using: composite
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true

    - name: Install dependencies
      shell: bash
      run: Rscript -e 'install.packages(c("rmarkdown", "yaml"))'

    - name: Validate protocols
      shell: bash
      run: Rscript "$GITHUB_ACTION_PATH/../../scripts/validate-protocol.R" "${{ inputs.protocols-path }}"

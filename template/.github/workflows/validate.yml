name: Validate Protocols

# No paths filter, so "CI validates every protocol on every pull request" is simply true. Add one
# back if your repository grows large enough for the Actions minutes to matter.
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: waldronlab/agent-protocol-standard/actions/validate-protocols@v0

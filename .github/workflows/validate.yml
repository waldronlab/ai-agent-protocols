name: Validate Protocols

on:
  pull_request:
    paths:
      - 'protocols/**'
      - 'scripts/validate-protocol.R'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install dependencies
        run: |
          install.packages(c("rmarkdown", "yaml"))
        shell: Rscript {0}

      - name: Run validation script
        run: |
          Rscript scripts/validate-protocol.R

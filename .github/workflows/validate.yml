name: Validate Protocols

on:
  pull_request:
    paths:
      - 'protocols/**'
      - 'scripts/**'
      - 'actions/**'
      - 'tests/**'

jobs:
  # Dogfood the action this repository publishes, rather than calling the script directly.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/validate-protocols

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install dependencies
        run: install.packages(c("rmarkdown", "yaml"))
        shell: Rscript {0}

      - name: Run validator test suite
        run: Rscript tests/run-tests.R

name: Generate Protocol Index

on:
  push:
    branches:
      - main
    paths:
      - 'protocols/**'
      - 'scripts/**'
      - 'actions/**'

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/generate-index

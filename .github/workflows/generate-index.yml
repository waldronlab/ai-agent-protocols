name: Generate Protocol Index

on:
  push:
    branches:
      - main
    paths:
      - 'protocols/**'
      - 'scripts/generate-protocols-yaml.R'

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install dependencies
        run: |
          install.packages(c("rmarkdown", "yaml"))
        shell: Rscript {0}

      - name: Generate PROTOCOLS.yaml
        run: |
          Rscript scripts/generate-protocols-yaml.R

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add PROTOCOLS.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: Update PROTOCOLS.yaml [skip ci]"
          git push
